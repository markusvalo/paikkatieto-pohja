# Lähderekisteri. Jokainen lähde: mistä, missä koordinaatistossa, millä lisenssillä.
# Agentti ja putket lukevat tämän – älä kovakoodaa URL-osoitteita skripteihin.
#
# Kentät:
#   nimi, tyyppi (ogc_api_features | wfs | wfs_gml | tiedosto | mcp | wms), url, epsg, lisenssi, attribuutio
#   (wfs_gml: WFS 1.0.0 / GML2 ilman sivutusta, palveluille, jotka eivät tarjoa GeoJSONia;
#    mcp: sijainniton MCP-palvelu, ei epsg:tä; wms: karttakuva vain QGISiin, putket eivät hae siitä)
#   kokoelma        OGC API -kokoelma tai WFS-tason nimi (typeNames); vaihtuva osa paikkamerkkinä
#                   ({vuosi}, {jakso}), jonka putki täydentää: lahteet.taydenna()
#   lisaparametrit  lisäparametrit hakuun, esim. {sortBy: id, cql_filter: "kunta='091'"}. GeoServerin
#                   WFS-sivutus vaatii sortBy-lajittelun, jos tasolla ei ole pääavainta, eikä GeoServer
#                   yhdistä bbox- ja cql_filter-rajausta (käytä silloin BBOX-ehtoa cql_filterissä).
#   paivitys        kuinka usein lähde päivittyy (vapaa teksti)
#   api_avain_env   ympäristömuuttuja, josta API-avain luetaan (EI itse avainta!)
#   huom            vapaa huomautus
#
# HUOM: alla olevat esimerkit on kirjoitettu pohjaa varten, eikä niiden URL-osoitteita ja
# tasonimiä ole tarkistettu verkosta. Tarkista ne ennen käyttöä: `pixi run paikka kokoelmat <lähde>`.

lahteet:

  mml_rakennukset:
    nimi: MML Maastotietokanta – rakennukset
    tyyppi: ogc_api_features
    url: https://avoin-paikkatieto.maanmittauslaitos.fi/maastotiedot/features/v1
    kokoelma: rakennus
    epsg: 3067
    api_avain_env: MML_API_KEY
    lisenssi: CC BY 4.0
    attribuutio: "Sisältää Maanmittauslaitoksen Maastotietokannan aineistoa"
    paivitys: jatkuva
    huom: API-avain maksutta MML:n asiointipalvelusta. Rajaa aina bboxilla – koko Suomi on raskas.

  hki_rakennukset:
    nimi: Helsingin rakennukset (rekisteritiedot)
    tyyppi: wfs
    url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs
    kokoelma: avoindata:Rakennukset_alue_rekisteritiedot
    epsg: 3879
    lisenssi: CC BY 4.0
    attribuutio: "Helsingin kaupunki, kaupunkimittauspalvelut"
    paivitys: viikoittain
    huom: Tarkista tason nimi GetCapabilities-vastauksesta.

  espoo_kaupunginosat:
    nimi: Espoon kaupunginosat
    tyyppi: wfs_gml
    url: https://kartat.espoo.fi/teklaogcweb/wfs.ashx
    kokoelma: GIS:Kaupunginosat
    epsg: 3879
    lisenssi: CC BY 4.0
    attribuutio: "Espoon kaupunki, kaupunkiympäristön toimiala"
    paivitys: tarvittaessa
    huom: Esimerkki WFS 1.0 / GML2 -lähteestä (tarkistettu 21.11.2026). Palvelu ei tarjoa GeoJSONia.

  kansallisarkisto_sisaltohaku:
    nimi: Kansallisarkisto – Sisältöhaku, tuomiokirjat (HTR-litteroinnit)
    tyyppi: mcp
    url: https://sisaltohaku.demo.kansallisarkisto.fi/mcp/
    kokoelma: tuomiokirjat
    lisenssi: CC BY 4.0 (Kansallisarkiston digitaaliset aineistot, JHS 189; kuvailutiedot CC0)
    attribuutio: "Kansallisarkisto, renovoidut tuomiokirjat (Sisältöhaku, Astia)"
    paivitys: harvoin (demopalvelu, litterointeja lisätään)
    huom: >-
      Esimerkki sijainnittomasta MCP-lähteestä (paikka.mcp.Asiakas, työkalu search_index). Demopalvelu:
      osoite ja työkalut voivat muuttua, joten haetaan enintään kutsu sekunnissa. Asiakirjoissa on
      henkilötietoja: ks. CLAUDE.md, sääntö 7, ennen tekstin tallentamista.

  tk_postinumeroalueet:
    nimi: Tilastokeskus – postinumeroalueet ja Paavo-tunnusluvut
    tyyppi: wfs
    url: https://geo.stat.fi/geoserver/postialue/wfs
    kokoelma: postialue:pno_tilasto_2024
    epsg: 3067
    lisenssi: CC BY 4.0
    attribuutio: "Tilastokeskus, Paavo – postinumeroalueittainen avoin tieto"
    paivitys: vuosittain
    huom: Vuosi on tason nimessä – päivitä vuosittain.

  gisco_nuts2:
    nimi: Eurostat GISCO – NUTS 2 -alueet 1:20M
    tyyppi: tiedosto
    url: https://gisco-services.ec.europa.eu/distribution/v2/nuts/geojson/NUTS_RG_20M_2021_4326_LEVL_2.geojson
    epsg: 4326
    lisenssi: EuroGeographics
    attribuutio: "© EuroGeographics for the administrative boundaries"
    paivitys: NUTS-luokituksen mukaan (~3 v)
    huom: Analysoi LAEA:ssa (3035), jaa WGS84:ssä. Tarkista käyttöehdot kaupalliseen käyttöön.
