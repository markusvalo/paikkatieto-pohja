# Testit ja linttaus jokaisessa pushissa ja PR:ssä. Ei verkkoyhteyttä vaativia testejä.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Asenna pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Välimuisti (conda-paketit)
        uses: actions/cache@v6
        with:
          path: ~/.cache/rattler
          key: pixi-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}

      - name: Ympäristö
        # Kun pixi.lock on commitoitu, vaihda: pixi install --locked
        run: pixi install

      - name: Linttaus
        run: pixi run lint

      - name: Testit
        run: pixi run test
